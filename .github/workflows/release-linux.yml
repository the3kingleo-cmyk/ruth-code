# Best-effort linux-x64 release for the private Ruth fork.
# This does not use upstream OpenCode publish/signing jobs (those workflows
# were moved to .github/workflows-upstream-disabled).
# A cold monorepo install + compile may exceed GitHub-hosted runner memory;
# if this workflow fails, build on a larger machine and attach the asset
# with `gh release upload` the same way the box build does.
name: Release linux-x64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile ruth linux-x64
        env:
          RUTH_TARGET: linux-x64
        run: bun run script/build.ts --skip-web-ui --skip-install
        working-directory: packages/cli

      - name: Pack asset and print version
        run: |
          set -euo pipefail
          test -x packages/cli/dist/cli-linux-x64/bin/ruth
          mkdir -p dist-release
          tar -C packages/cli/dist/cli-linux-x64/bin -czf dist-release/ruth-linux-x64.tar.gz ruth
          sha256sum dist-release/ruth-linux-x64.tar.gz | tee dist-release/ruth-linux-x64.tar.gz.sha256
          packages/cli/dist/cli-linux-x64/bin/ruth --version

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/ruth-linux-x64.tar.gz
            dist-release/ruth-linux-x64.tar.gz.sha256
          generate_release_notes: true
